openapi: 3.1.0
info:
  title: Zależności mikroserwisu Atrakcje
  version: 0.3.0
  description: Kontrakty Warunków dnia, Transportu i Discovery.
paths:
  /api/weather/day:
    get:
      operationId: getWeatherDay
      summary: Prognoza dla dnia planu
      description: >-
        Wymagane jest city albo para lat i lon. Dopuszczalne daty to dziś
        do dziś + 15 dni włącznie.
      parameters:
        - name: date
          in: query
          required: true
          schema: {type: string, format: date}
        - name: city
          in: query
          schema: {type: string}
        - name: lat
          in: query
          schema: {type: number, minimum: -90, maximum: 90}
        - name: lon
          in: query
          schema: {type: number, minimum: -180, maximum: 180}
      responses:
        '200':
          description: Prognoza dla żądanego dnia. Tablica days zawiera jeden element.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forecast'
        '400':
          description: Nieprawidłowe parametry.
        '404':
          description: Nie znaleziono miasta.
        '503':
          description: Zewnętrzne API pogody jest niedostępne.
          headers:
            Retry-After:
              schema: {type: integer, const: 60}
  /services/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getServiceAddress
      servers:
        - url: http://172.20.147.20:8080
      responses:
        '200':
          description: Zarejestrowany adres IP usługi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAddress'
        '404':
          description: Usługa nie została zarejestrowana.
  /services:
    post:
      operationId: registerService
      servers:
        - url: http://172.20.147.20:8080
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                ip: {type: string}
      responses:
        '200':
          description: Zaktualizowano adres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAddress'
        '201':
          description: Zarejestrowano usługę.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAddress'
        '400':
          description: Brak nazwy usługi.
  /api/v1/routes:
    post:
      operationId: getRoutes
      summary: Zbiorcza wycena odcinków od lub do punktu start
      description: >-
        Limit czasu klienta to 2 s. Odcinki są symetryczne. Wyniki zachowują kolejność
        i liczbę par wejściowych. Koszt każdego trybu jest wyrażony w groszach na osobę.
        WALK obejmuje odcinki do 3,5 km i kosztuje 0 gr, PUBLIC_TRANSPORT kosztuje
        480 gr za odcinek, a CAR oznacza taxi. Para tego samego punktu kosztuje 0 gr
        i trwa 0 minut. Nieznana lokalizacja lub brak połączenia daje NO_CONNECTION
        dla danej pary przy HTTP 200.
      servers:
        - url: http://172.20.147.17:8083
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
            example:
              mode: WALK
              pairs:
                - {fromLocationId: start, toLocationId: attr-01}
                - {fromLocationId: attr-01, toLocationId: start}
                - {fromLocationId: start, toLocationId: attr-06}
      responses:
        '200':
          description: Wyniki wszystkich par w kolejności żądania.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
              example:
                mode: WALK
                results:
                  - {fromLocationId: start, toLocationId: attr-01, status: OK, durationMin: 15, costGrosze: 0}
                  - {fromLocationId: attr-01, toLocationId: start, status: OK, durationMin: 15, costGrosze: 0}
                  - {fromLocationId: start, toLocationId: attr-06, status: NO_CONNECTION}
        '400':
          description: Niepoprawne żądanie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
              example: {error: BAD_REQUEST, message: Niepoprawny JSON albo nieznany tryb}
        '500':
          description: Wewnętrzny błąd Transportu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
              example: {error: INTERNAL_ERROR, message: Błąd wewnętrzny}
  /health:
    get:
      operationId: getTransportHealth
      servers:
        - url: http://172.20.147.17:8083
      responses:
        '200':
          description: Transport działa.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: UP
  /api/v1/modes:
    get:
      operationId: getTransportModes
      servers:
        - url: http://172.20.147.17:8083
      responses:
        '200':
          description: Obsługiwane tryby podróży.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransportMode'
              example: [WALK, PUBLIC_TRANSPORT, CAR]
  /api/v1/locations:
    get:
      operationId: getTransportLocations
      servers:
        - url: http://172.20.147.17:8083
      responses:
        '200':
          description: Znane identyfikatory lokalizacji, w tym punkt startowy.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationId'
components:
  schemas:
    Forecast:
      type: object
      required: [location, days, stale]
      properties:
        location:
          type: object
          required: [name, lat, lon]
          properties:
            name: {type: [string, 'null']}
            lat: {type: number}
            lon: {type: number}
        days:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [date, tempMin, tempMax, precipitationMm, windKph, category]
            properties:
              date: {type: string, format: date}
              tempMin: {type: number}
              tempMax: {type: number}
              precipitationMm: {type: number}
              windKph: {type: number}
              category:
                enum: [SUNNY, CLOUDY, RAIN, SNOW, STORM]
        stale: {type: boolean}
    ServiceAddress:
      type: object
      required: [name, ip, registeredAt]
      properties:
        name: {type: string}
        ip: {type: string}
        registeredAt: {type: string, format: date-time}
    TransportMode:
      type: string
      enum: [WALK, PUBLIC_TRANSPORT, CAR]
    LocationId:
      type: string
      minLength: 1
    Pair:
      type: object
      required: [fromLocationId, toLocationId]
      properties:
        fromLocationId:
          $ref: '#/components/schemas/LocationId'
        toLocationId:
          $ref: '#/components/schemas/LocationId'
    RouteRequest:
      type: object
      required: [mode, pairs]
      properties:
        mode:
          $ref: '#/components/schemas/TransportMode'
        pairs:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Pair'
    RouteResponse:
      type: object
      required: [mode, results]
      properties:
        mode:
          $ref: '#/components/schemas/TransportMode'
        results:
          type: array
          items:
            $ref: '#/components/schemas/RouteResult'
    RouteResult:
      allOf:
        - $ref: '#/components/schemas/Pair'
        - oneOf:
            - type: object
              required: [status, durationMin, costGrosze]
              properties:
                status:
                  const: OK
                durationMin:
                  type: integer
                  minimum: 0
                costGrosze:
                  type: integer
                  minimum: 0
            - type: object
              required: [status]
              properties:
                status:
                  const: NO_CONNECTION
                durationMin: false
                costGrosze: false
    TransportError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [BAD_REQUEST, INTERNAL_ERROR]
        message:
          type: string
