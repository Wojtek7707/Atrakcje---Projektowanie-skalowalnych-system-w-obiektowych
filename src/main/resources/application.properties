spring.application.name=attractions
spring.threads.virtual.enabled=true
server.port=8001
app.start-max-distance-m=${APP_START_MAX_DISTANCE_M:1000}
app.max-candidates=${APP_MAX_CANDIDATES:50}
app.downstream.weather-url=${APP_WEATHER_URL:}
app.downstream.transport-url=${APP_TRANSPORT_URL:http://172.20.147.17:8083}
app.downstream.discovery-url=${APP_DISCOVERY_URL:}
app.downstream.advertise-ip=${APP_DISCOVERY_ADVERTISE_IP:}
app.downstream.dependency-timeout-ms=${APP_DEPENDENCY_TIMEOUT_MS:2000}
app.downstream.circuit-open-ms=${APP_CIRCUIT_OPEN_MS:30000}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
