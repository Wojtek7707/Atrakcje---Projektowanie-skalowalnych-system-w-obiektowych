services:
  attractions:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-local,mock}"
      APP_WEATHER_URL: "${APP_WEATHER_URL:-}"
      APP_TRANSPORT_URL: "${APP_TRANSPORT_URL:-http://172.20.147.17:8083}"
      APP_DISCOVERY_URL: "${APP_DISCOVERY_URL:-}"
      APP_DISCOVERY_ADVERTISE_IP: "${APP_DISCOVERY_ADVERTISE_IP:-}"
      APP_DISCOVERY_REGISTRATION_INTERVAL_MS: "${APP_DISCOVERY_REGISTRATION_INTERVAL_MS:-60000}"
      APP_DEPENDENCY_TIMEOUT_MS: "${APP_DEPENDENCY_TIMEOUT_MS:-2000}"
      APP_CIRCUIT_OPEN_MS: "${APP_CIRCUIT_OPEN_MS:-30000}"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:
    ports:
      - "8000:8001"
